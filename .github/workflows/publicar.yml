# Publica el sitio cada vez que hay cambios en la rama main.
# Construye el sitio (fotos optimizadas, páginas, .htaccess) y lo deja listo en la rama "sitio",
# que es la que Hostinger copia a public_html. No necesita contraseñas ni claves guardadas.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'formulario/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-sitio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Recuperar las imágenes ya procesadas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/imagenes
          key: imagenes-${{ hashFiles('contenido/proyectos/**', 'contenido/sitio/**', 'scripts/lib/imagenes.mjs') }}
          restore-keys: imagenes-

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Construir el sitio
        run: npm run build

      - name: Revisar enlaces, imágenes y redirecciones
        run: npm run verificar

      - name: Dejar el sitio en la rama "sitio"
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin sitio > /dev/null; then
            git fetch --depth 1 origin sitio
            git worktree add --detach ../rama-sitio FETCH_HEAD
            git -C ../rama-sitio checkout -q -B sitio
          else
            git worktree add --orphan -b sitio ../rama-sitio
          fi
          cd ../rama-sitio
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/publicar/." .
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -q -m "Publicación ${GITHUB_SHA::7}: ${MENSAJE%%$'\n'*}"
          git push origin sitio
          echo "Publicado. Hostinger toma la rama 'sitio' en unos segundos."
